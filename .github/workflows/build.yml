name: Build and Publish Docker Images

on:
  push:
    branches: [ dogeos ]
    tags:
      - "v*"
  pull_request:
    branches: [ dogeos ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Cache Blockbook binary
      id: cache-blockbook
      uses: actions/cache@v4
      with:
        path: build/blockbook
        key: ${{ runner.os }}-blockbook-${{ hashFiles('go.mod', 'go.sum', '**/*.go', 'Makefile') }}
        restore-keys: |
          ${{ runner.os }}-blockbook-${{ hashFiles('go.mod', 'go.sum') }}-
          ${{ runner.os }}-blockbook-

    - name: Build Blockbook binary
      if: steps.cache-blockbook.outputs.cache-hit != 'true'
      run: make build BASE_IMAGE=debian:11 ARGS="-j3"

    - name: Generate testnet config
      run: ./contrib/scripts/build-blockchaincfg.sh dogecoin_testnet_dogeos && mv build/blockchaincfg.json build/blockchaincfg_testnet.json

    - name: Generate mainnet config
      run: ./contrib/scripts/build-blockchaincfg.sh dogecoin_dogeos && mv build/blockchaincfg.json build/blockchaincfg_mainnet.json

    - name: Build and push testnet image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: ${{ github.event_name != 'pull_request' }}
        tags: dogeos69/blockbook:testnet
        platforms: linux/amd64
        build-args: NETWORK=testnet

    - name: Build and push mainnet image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: ${{ github.event_name != 'pull_request' }}
        tags: dogeos69/blockbook:mainnet
        platforms: linux/amd64
        build-args: NETWORK=mainnet
